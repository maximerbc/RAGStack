[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-2026"
version = "0.1.0"
description = "Production-engineered conversational RAG with live evaluation"
requires-python = ">=3.10,<3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "docling>=2.50",
  "fastapi>=0.115",
  "lancedb>=0.24",
  "openai>=1.100",
  "pydantic-settings>=2.8",
  "python-multipart>=0.0.20",
  "sentence-transformers>=4.0",
  "tiktoken>=0.9",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[project.scripts]
rag-2026 = "app.main:run"
rag-2026-download-model = "app.services.reranker:download_default_model"
rag-2026-perf-50k = "app.perf:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
